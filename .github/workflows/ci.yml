name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its running check. Every push to main is its own group, so each one runs to
# the end and main's history shows a result for every commit, never a cancelled run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  slayer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: slayer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slayer/package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Typecheck
        run: |
          npx tsc --noEmit -p .
          npx tsc --noEmit -p tsconfig.node.json
      - name: Build
        run: npm run build
      - name: Proofs and golden tests
        # the one list (scripts/run-proofs.mjs) that `npm test` runs too
        run: npm test

  browser-smoke:
    # the production build served by the app's own server with no keys (every page in its offline state), every route
    # loaded in Chromium at 1440x900 and 390x844: no console error, no NaN or "undefined", no sideways overflow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: slayer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slayer/package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Chromium's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Build
        run: npx vite build
      - name: Smoke every route
        run: node scripts/browser-smoke.mjs
