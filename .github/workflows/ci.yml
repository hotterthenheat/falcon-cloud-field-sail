name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its running check. Every push to main is its own group, so each one runs to
# the end and main's history shows a result for every commit, never a cancelled run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  slayer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: slayer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slayer/package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Typecheck
        run: |
          npx tsc --noEmit -p .
          npx tsc --noEmit -p tsconfig.node.json
      - name: Build
        run: npm run build
      - name: Proof scripts
        run: |
          set -e
          for f in trace-moneyness-proof gamma-sign-proof lgbm-parity-proof chart-proof clock-proof contract-quote-proof \
            fixture-proof higher-proof paper-proof replay-proof review-engine-proof \
            review-journal-proof spx-book-proof terrain-contract-proof terrain-setups-proof exposure-recorder-proof pine-proof; do
            echo "::group::$f"
            npx tsx "scripts/$f.ts"
            echo "::endgroup::"
          done
          node scripts/proxy-auth-proof.mjs
          node scripts/hub-proof.mjs
      - name: Golden tests
        run: |
          set -e
          for f in scripts/golden/*-golden.ts; do
            echo "::group::$f"
            npx tsx "$f"
            echo "::endgroup::"
          done
